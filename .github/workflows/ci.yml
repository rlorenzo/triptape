name: ci

on:
  push:
    branches: ["main", "sprint/**"]
  pull_request:

permissions:
  contents: read

# A PR push from a sprint branch triggers both events; keep only the latest run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The Tauri app embeds the built frontend (frontendDist: ../dist),
      # so the web bundle must exist before clippy/test compile the app crate.
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg typst exiftool
      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg typst exiftool -y
      - run: cargo test --workspace
      # Bash scripts: force Git Bash on Windows (default shell is PowerShell).
      - name: FFmpeg capability check
        shell: bash
        run: ./scripts/check-ffmpeg.sh
      - name: Fixture render smoke (tiny synthetic trip)
        shell: bash
        run: |
          ./scripts/make-fixture.sh "$RUNNER_TEMP/fixture"
          ./scripts/spike-render.sh

  linters:
    name: linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unused code and duplication (fallow, jscpd)
        run: npm run lint
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Install deadwood
        run: cargo install --locked --git https://github.com/rlorenzo/deadwood --rev 1fd13d0c8e5222bb48788451ce5a32e6770129dd deadwood-rs
      - name: Dead Rust code and dependencies (deadwood)
        # deadwood resolves lib names with `cargo metadata --frozen`; without a
        # populated registry it falls back to package names and misflags
        # kamadak-exif (imported as `exif`) as unused.
        run: |
          cargo fetch --locked
          deadwood check .
      - name: Dependency policy (cargo-deny)
        run: cargo deny check
      - name: Security advisories (cargo-audit)
        run: cargo audit

  frontend:
    name: npm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
