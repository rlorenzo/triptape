# Dependency policy, checked in CI with `cargo deny check`.

[advisories]
# Tauri's Linux and Windows stack pulls in unmaintained crates we can't replace,
# so only direct dependencies fail on that.
unmaintained = "workspace"

[licenses]
# MPL-2.0 is file-level copyleft and stays in its own crates. LGPL and GPL are not
# allowed here; FFmpeg's GPL applies to a separate executable, not this tree.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Our own workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
