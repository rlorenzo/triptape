[package]
name = "triptape-core"
version = "0.1.0"
license = "MIT"
publish = false
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
blake3 = "1"
dirs = "7"
image = "0.25"
jiff = { version = "0.2", default-features = false, features = ["std"] }
kamadak-exif = "0.5"
rexif = "0.7"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
