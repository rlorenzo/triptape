[package]
name = "triptape-media"
version = "0.1.0"
license = "MIT"
publish = false
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
image = "0.25"
triptape-core = { path = "../triptape-core" }
tempfile = "3"
blake3 = "1"
dirs = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
